<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360度全景图查看器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
            z-index: 10;
        }

        .warning-box {
            width: 100%;
            max-width: 100%;
            background-color: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            color: #856404;
            font-size: 14px;
            line-height: 1.5;
        }

        .warning-box strong {
            color: #d39e00;
        }

        .upload-area {
            width: 100%;
            max-width: 100%;
            height: 120px;
            border: 3px dashed #4a90e2;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            background-color: #f8f9fa;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .upload-area:hover {
            background-color: #e9f5ff;
            border-color: #217ad9;
        }

        .upload-area.dragover {
            background-color: #d4edda;
            border-color: #28a745;
        }

        .upload-icon {
            font-size: 36px;
            color: #4a90e2;
            margin-bottom: 8px;
        }

        .upload-text {
            color: #666;
            font-size: 16px;
            margin-bottom: 3px;
        }

        .upload-subtext {
            color: #999;
            font-size: 13px;
        }

        #fileInput {
            display: none;
        }

        .panorama-container {
            width: 100%;
            max-width: 100%;
            height: calc(100vh - 350px);
            min-height: 400px;
            position: relative;
            border: 5px solid #333;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            background-color: #000;
        }

        /* 分辨率全屏模式 */
        .resolution-fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            border: none;
            border-radius: 0;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 0;
        }

        .resolution-fullscreen #panoramaCanvas {
            width: auto;
            height: auto;
            max-width: 100vw;
            max-height: 100vh;
        }

        #panoramaCanvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: grab;
        }

        #panoramaCanvas:active {
            cursor: grabbing;
        }

        .empty-state {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #888;
            font-size: 18px;
            text-align: center;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: white;
            z-index: 10;
        }

        .loading-overlay.active {
            display: flex;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #4a90e2;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .instructions {
            margin-top: 15px;
            text-align: center;
            color: #666;
            font-size: 15px;
        }

        .info {
            margin-top: 8px;
            text-align: center;
            color: #888;
            font-size: 13px;
        }

        .error-message {
            color: #dc3545;
            font-weight: bold;
        }

        .success-message {
            color: #28a745;
            font-weight: bold;
        }

        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 5;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        .control-btn {
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s;
            white-space: nowrap;
        }

        .control-btn:hover {
            background-color: rgba(0, 0, 0, 0.7);
        }

        .control-btn:disabled {
            background-color: rgba(0, 0, 0, 0.3);
            cursor: not-allowed;
        }

        .resolution-select {
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
        }

        .resolution-select option {
            background-color: #333;
            color: white;
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 5px;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 5px;
            color: white;
            font-size: 14px;
        }

        .speed-control input {
            width: 80px;
        }

        /* 全屏模式下的退出按钮 */
        .exit-fullscreen-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 3000;
            background-color: rgba(255, 0, 0, 0.7);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            display: none;
        }

        .exit-fullscreen-btn:hover {
            background-color: rgba(255, 0, 0, 0.9);
        }

        @media (max-width: 768px) {
            .panorama-container {
                height: calc(100vh - 300px);
                min-height: 300px;
            }
            
            .upload-area {
                height: 100px;
            }
            
            .controls {
                bottom: 10px;
                gap: 5px;
            }
            
            .control-btn {
                padding: 6px 10px;
                font-size: 12px;
            }
            
            .resolution-select {
                padding: 6px 8px;
                font-size: 12px;
            }
            
            .speed-control {
                padding: 3px 8px;
                font-size: 12px;
            }
            
            .speed-control input {
                width: 60px;
            }
        }

        @media (max-width: 480px) {
            .panorama-container {
                height: calc(100vh - 250px);
                min-height: 250px;
            }
            
            .upload-area {
                height: 80px;
            }
            
            .upload-icon {
                font-size: 28px;
            }
            
            .upload-text {
                font-size: 14px;
            }
            
            .upload-subtext {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <h1>360度全景图查看器</h1>
    
    <div class="warning-box" id="warningBox">
        <strong>⚠️ 重要提示：</strong>如果直接双击打开此文件，图片可能无法加载。请使用本地服务器运行，推荐使用VS Code的Live Server扩展。
    </div>
    
    <div class="upload-area" id="uploadArea">
        <div class="upload-icon">🌍</div>
        <p class="upload-text">点击上传或拖放360度全景图到此处</p>
        <p class="upload-subtext">支持等矩形投影(2:1比例)的JPG、PNG、WebP格式</p>
        <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp">
    </div>
    
    <div class="panorama-container" id="panoramaContainer">
        <div class="empty-state" id="emptyState">
            请上传一张360度全景图开始沉浸式体验
        </div>
        <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner"></div>
            <p>正在加载全景图...</p>
        </div>
        <canvas id="panoramaCanvas"></canvas>
        <div class="controls" id="controls" style="display: none;">
            <button class="control-btn" id="autoRotateBtn">自动旋转: 开</button>
            <button class="control-btn" id="resetBtn">重置视角</button>
            <button class="control-btn" id="fullscreenBtn">全屏预览</button>
            <button class="control-btn" id="screenshotBtn">截取画面</button>
            <select class="resolution-select" id="resolutionSelect">
                <option value="auto" selected>自适应全屏</option>
                
                <!-- 16:9 宽屏系列 -->
                <option value="1280x720">1280×720 (HD 16:9)</option>
                <option value="1366x768">1366×768 (WXGA 16:9)</option>
                <option value="1600x900">1600×900 (HD+ 16:9)</option>
                <option value="1920x1080">1920×1080 (FHD 16:9)</option>
                <option value="2560x1440">2560×1440 (QHD 16:9)</option>
                <option value="3840x2160">3840×2160 (4K UHD 16:9)</option>
                <option value="7680x4320">7680×4320 (8K UHD 16:9)</option>

                <!-- 16:10 宽屏系列 -->
                <option value="1280x800">1280×800 (WXGA 16:10)</option>
                <option value="1440x900">1440×900 (WXGA+ 16:10)</option>
                <option value="1680x1050">1680×1050 (WSXGA+ 16:10)</option>
                <option value="1920x1200">1920×1200 (WUXGA 16:10)</option>
                <option value="2560x1600">2560×1600 (WQXGA 16:10)</option>

                <!-- 21:9 超宽系列 -->
                <option value="2560x1080">2560×1080 (WFHD 21:9)</option>
                <option value="3440x1440">3440×1440 (UWQHD 21:9)</option>
                <option value="3840x1600">3840×1600 (UW4K 21:9)</option>

                <!-- 4:3 及 5:4 传统系列 -->
                <option value="1024x768">1024×768 (XGA 4:3)</option>
                <option value="1280x1024">1280×1024 (SXGA 5:4)</option>
                <option value="1440x1080">1440×1080 (4:3)</option>
                <option value="1600x1200">1600×1200 (UXGA 4:3)</option>

                <!-- 1:1 方形系列 -->
                <option value="1080x1080">1080×1080 (1:1 方形)</option>

                <!-- 竖屏系列 (9:16 / 9:18等) -->
                <option value="720x1280">720×1280 (HD竖屏 9:16)</option>
                <option value="1080x1920">1080×1920 (FHD竖屏 9:16)</option>
                <option value="1440x2560">1440×2560 (QHD竖屏 9:16)</option>
                <option value="2160x3840">2160×3840 (4K竖屏 9:16)</option>
            </select>
            <div class="speed-control">
                <span>速度:</span>
                <input type="range" id="speedSlider" min="0.1" max="1" step="0.1" value="0.2">
            </div>
        </div>
    </div>
    
    <!-- 退出全屏按钮 -->
    <button class="exit-fullscreen-btn" id="exitFullscreenBtn">退出全屏 (ESC)</button>
    
    <p class="instructions" id="instructions" style="display: none;">
        按住鼠标拖动/触摸屏滑动查看 | 鼠标滚轮/双指缩放 | 方向键控制视角 | +/- 缩放 | S键截图
    </p>
    <p class="info" id="info">等待上传全景图...</p>

    <!-- 引入Three.js库 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 检查是否使用file协议
            if (window.location.protocol === 'file:') {
                document.getElementById('warningBox').style.display = 'block';
            } else {
                document.getElementById('warningBox').style.display = 'none';
            }
            
            const uploadArea = document.getElementById('uploadArea');
            const fileInput = document.getElementById('fileInput');
            const container = document.getElementById('panoramaContainer');
            const canvas = document.getElementById('panoramaCanvas');
            const emptyState = document.getElementById('emptyState');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const instructions = document.getElementById('instructions');
            const info = document.getElementById('info');
            const controls = document.getElementById('controls');
            const autoRotateBtn = document.getElementById('autoRotateBtn');
            const resetBtn = document.getElementById('resetBtn');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const screenshotBtn = document.getElementById('screenshotBtn');
            const resolutionSelect = document.getElementById('resolutionSelect');
            const speedSlider = document.getElementById('speedSlider');
            const exitFullscreenBtn = document.getElementById('exitFullscreenBtn');
            
            let scene, camera, renderer, sphere;
            let isDragging = false;
            let previousMousePosition = { x: 0, y: 0 };
            let spherical = new THREE.Spherical(10, Math.PI / 2, 0);
            let autoRotate = true;
            let rotateSpeed = 0.002;
            let panoramaLoaded = false;
            let fov = 75; // 初始视场角（控制缩放）
            const minFov = 30; // 最大缩放
            const maxFov = 120; // 最小缩放
            let originalPixelRatio;
            let isFullscreenMode = false;
            let selectedResolution = 'auto';
            
            // 初始化Three.js场景
            function initScene() {
                try {
                    // 创建场景
                    scene = new THREE.Scene();
                    
                    // 创建相机
                    camera = new THREE.PerspectiveCamera(fov, container.clientWidth / container.clientHeight, 0.1, 1000);
                    camera.position.set(0, 0, 0);
                    
                    // 创建渲染器
                    renderer = new THREE.WebGLRenderer({ 
                        canvas: canvas, 
                        antialias: true, 
                        preserveDrawingBuffer: true,
                        alpha: true
                    });
                    renderer.setSize(container.clientWidth, container.clientHeight);
                    originalPixelRatio = window.devicePixelRatio;
                    renderer.setPixelRatio(originalPixelRatio);
                    
                    // 创建球体（全景图将贴在球体内部）
                    const geometry = new THREE.SphereGeometry(50, 64, 64);
                    // 反转法线，使材质显示在球体内部
                    geometry.scale(-1, 1, 1);
                    
                    // 创建材质（初始为黑色）
                    const material = new THREE.MeshBasicMaterial({
                        color: 0x000000,
                        side: THREE.DoubleSide
                    });
                    
                    sphere = new THREE.Mesh(geometry, material);
                    scene.add(sphere);
                    
                    // 开始渲染循环
                    animate();
                    
                    info.textContent = 'Three.js初始化成功，等待上传全景图...';
                } catch (error) {
                    showError('Three.js初始化失败: ' + error.message);
                    console.error('Three.js初始化错误:', error);
                }
            }
            
            // 渲染循环
            function animate() {
                requestAnimationFrame(animate);
                
                if (panoramaLoaded && autoRotate && !isDragging) {
                    spherical.theta += rotateSpeed;
                    updateCameraPosition();
                }
                
                if (renderer && scene && camera) {
                    renderer.render(scene, camera);
                }
            }
            
            // 更新相机位置
            function updateCameraPosition() {
                camera.position.setFromSpherical(spherical);
                camera.lookAt(0, 0, 0);
            }
            
            // 更新相机缩放
            function updateCameraZoom() {
                camera.fov = fov;
                camera.updateProjectionMatrix();
            }
            
            // 加载全景图
            function loadPanorama(imageUrl) {
                showLoading();
                
                try {
                    const textureLoader = new THREE.TextureLoader();
                    
                    // 设置跨域
                    textureLoader.crossOrigin = 'anonymous';
                    
                    textureLoader.load(
                        imageUrl,
                        function(texture) {
                            try {
                                // 设置纹理参数
                                texture.encoding = THREE.sRGBEncoding;
                                texture.minFilter = THREE.LinearFilter;
                                texture.magFilter = THREE.LinearFilter;
                                texture.generateMipmaps = false;
                                
                                // 更新球体材质
                                if (sphere.material.map) {
                                    sphere.material.map.dispose();
                                }
                                sphere.material.dispose();
                                sphere.material = new THREE.MeshBasicMaterial({
                                    map: texture,
                                    side: THREE.DoubleSide
                                });
                                
                                // 重置视角和缩放
                                resetView();
                                
                                // 显示成功状态
                                panoramaLoaded = true;
                                hideLoading();
                                showSuccess('全景图加载成功！');
                                emptyState.style.display = 'none';
                                instructions.style.display = 'block';
                                controls.style.display = 'flex';
                                fullscreenBtn.disabled = false;
                                screenshotBtn.disabled = false;
                                
                                // 更新信息
                                info.textContent = `全景图尺寸: ${texture.image.width}x${texture.image.height}px | 当前分辨率: ${selectedResolution === 'auto' ? '自适应' : selectedResolution.replace('x', '×')}`;
                            } catch (error) {
                                hideLoading();
                                showError('纹理处理失败: ' + error.message);
                                console.error('纹理处理错误:', error);
                            }
                        },
                        function(xhr) {
                            if (xhr.lengthComputable) {
                                const percent = Math.round((xhr.loaded / xhr.total) * 100);
                                loadingOverlay.querySelector('p').textContent = `正在加载全景图... ${percent}%`;
                            }
                        },
                        function(error) {
                            hideLoading();
                            showError('图片加载失败！请确保使用本地服务器运行（如VS Code Live Server）');
                            console.error('图片加载错误:', error);
                        }
                    );
                } catch (error) {
                    hideLoading();
                    showError('加载过程出错: ' + error.message);
                    console.error('加载过程错误:', error);
                }
            }
            
            // 重置视角和缩放
            function resetView() {
                spherical = new THREE.Spherical(10, Math.PI / 2, 0);
                fov = 75;
                updateCameraPosition();
                updateCameraZoom();
            }
            
            // 切换分辨率全屏模式
            function toggleResolutionFullscreen() {
                if (!panoramaLoaded) return;
                
                if (!isFullscreenMode) {
                    // 进入分辨率全屏模式
                    selectedResolution = resolutionSelect.value;
                    
                    container.classList.add('resolution-fullscreen');
                    exitFullscreenBtn.style.display = 'block';
                    
                    if (selectedResolution === 'auto') {
                        // 自适应模式：占满整个屏幕
                        canvas.style.width = '100%';
                        canvas.style.height = '100%';
                        canvas.style.maxWidth = '100%';
                        canvas.style.maxHeight = '100%';
                        
                        info.textContent = `全景图尺寸: ${sphere.material.map.image.width}x${sphere.material.map.image.height}px | 全屏模式: 自适应`;
                    } else {
                        // 指定分辨率模式：居中显示
                        const [width, height] = selectedResolution.split('x').map(Number);
                        
                        canvas.style.width = `${width}px`;
                        canvas.style.height = `${height}px`;
                        canvas.style.maxWidth = '95vw';
                        canvas.style.maxHeight = '95vh';
                        
                        info.textContent = `全景图尺寸: ${sphere.material.map.image.width}x${sphere.material.map.image.height}px | 全屏模式: ${selectedResolution.replace('x', '×')} (居中显示)`;
                    }
                    
                    isFullscreenMode = true;
                    fullscreenBtn.textContent = '退出全屏';
                    
                    // 重新调整渲染器
                    setTimeout(() => {
                        camera.aspect = canvas.clientWidth / canvas.clientHeight;
                        camera.updateProjectionMatrix();
                        renderer.setSize(canvas.clientWidth, canvas.clientHeight);
                    }, 100);
                    
                } else {
                    // 退出分辨率全屏模式
                    exitFullscreenMode();
                }
            }
            
            // 退出全屏模式
            function exitFullscreenMode() {
                container.classList.remove('resolution-fullscreen');
                exitFullscreenBtn.style.display = 'none';
                
                // 恢复canvas样式
                canvas.style.width = '100%';
                canvas.style.height = '100%';
                canvas.style.maxWidth = '100%';
                canvas.style.maxHeight = '100%';
                
                isFullscreenMode = false;
                fullscreenBtn.textContent = '全屏预览';
                
                // 重新调整渲染器
                setTimeout(() => {
                    camera.aspect = container.clientWidth / container.clientHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(container.clientWidth, container.clientHeight);
                    
                    info.textContent = `全景图尺寸: ${sphere.material.map.image.width}x${sphere.material.map.image.height}px | 当前分辨率: ${selectedResolution === 'auto' ? '自适应' : selectedResolution.replace('x', '×')}`;
                }, 100);
            }
            
            // 截图功能 - 精确截取当前显示的画面
            function takeScreenshot() {
                if (!panoramaLoaded) return;
                
                screenshotBtn.disabled = true;
                screenshotBtn.textContent = '正在截图...';
                
                try {
                    // 直接截取当前canvas显示的内容
                    const dataURL = canvas.toDataURL('image/png', 1.0);
                    
                    // 创建下载链接
                    const link = document.createElement('a');
                    const now = new Date();
                    const timestamp = `${now.getFullYear()}${(now.getMonth()+1).toString().padStart(2,'0')}${now.getDate().toString().padStart(2,'0')}_${now.getHours().toString().padStart(2,'0')}${now.getMinutes().toString().padStart(2,'0')}${now.getSeconds().toString().padStart(2,'0')}`;
                    
                    // 文件名包含当前分辨率
                    let resolutionName = selectedResolution === 'auto' ? 'auto' : selectedResolution.replace('x', '×');
                    link.download = `panorama_${resolutionName}_${timestamp}.png`;
                    link.href = dataURL;
                    link.click();
                    
                    // 恢复按钮状态
                    setTimeout(() => {
                        screenshotBtn.disabled = false;
                        screenshotBtn.textContent = '截取画面';
                        showSuccess(`截图已保存！尺寸: ${canvas.clientWidth}×${canvas.clientHeight}px`);
                    }, 500);
                } catch (error) {
                    screenshotBtn.disabled = false;
                    screenshotBtn.textContent = '截取画面';
                    showError('截图失败: ' + error.message);
                    console.error('截图错误:', error);
                }
            }
            
            // 鼠标/触摸事件处理
            function handleStart(e) {
                if (!panoramaLoaded) return;
                
                e.preventDefault();
                isDragging = true;
                
                if (e.type === 'touchstart') {
                    previousMousePosition = {
                        x: e.touches[0].clientX,
                        y: e.touches[0].clientY
                    };
                } else {
                    previousMousePosition = {
                        x: e.clientX,
                        y: e.clientY
                    };
                }
            }
            
            function handleMove(e) {
                if (!isDragging || !panoramaLoaded) return;
                
                e.preventDefault();
                
                let currentMousePosition;
                if (e.type === 'touchmove') {
                    currentMousePosition = {
                        x: e.touches[0].clientX,
                        y: e.touches[0].clientY
                    };
                } else {
                    currentMousePosition = {
                        x: e.clientX,
                        y: e.clientY
                    };
                }
                
                const deltaX = currentMousePosition.x - previousMousePosition.x;
                const deltaY = currentMousePosition.y - previousMousePosition.y;
                
                // 更新球面坐标
                spherical.theta -= deltaX * 0.005;
                spherical.phi += deltaY * 0.005;
                
                // 限制垂直视角（防止翻转）
                spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi));
                
                updateCameraPosition();
                
                previousMousePosition = currentMousePosition;
            }
            
            function handleEnd() {
                isDragging = false;
            }
            
            // 鼠标滚轮缩放
            function handleWheel(e) {
                if (!panoramaLoaded) return;
                
                e.preventDefault();
                
                // 调整视场角实现缩放
                if (e.deltaY > 0) {
                    fov = Math.min(maxFov, fov + 5);
                } else {
                    fov = Math.max(minFov, fov - 5);
                }
                
                updateCameraZoom();
            }
            
            // 双指缩放（触摸设备）
            let initialPinchDistance = 0;
            
            function handleTouchStart(e) {
                if (e.touches.length === 2) {
                    initialPinchDistance = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                } else {
                    handleStart(e);
                }
            }
            
            function handleTouchMove(e) {
                if (e.touches.length === 2) {
                    e.preventDefault();
                    
                    const currentPinchDistance = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    
                    const delta = initialPinchDistance - currentPinchDistance;
                    fov = Math.max(minFov, Math.min(maxFov, fov + delta * 0.1));
                    updateCameraZoom();
                    
                    initialPinchDistance = currentPinchDistance;
                } else {
                    handleMove(e);
                }
            }
            
            // 键盘控制
            function handleKeyDown(e) {
                if (!panoramaLoaded) return;
                
                switch(e.key) {
                    case 'ArrowLeft':
                        spherical.theta += 0.05;
                        break;
                    case 'ArrowRight':
                        spherical.theta -= 0.05;
                        break;
                    case 'ArrowUp':
                        spherical.phi -= 0.05;
                        break;
                    case 'ArrowDown':
                        spherical.phi += 0.05;
                        break;
                    case '+':
                    case '=':
                        fov = Math.max(minFov, fov - 5);
                        updateCameraZoom();
                        break;
                    case '-':
                        fov = Math.min(maxFov, fov + 5);
                        updateCameraZoom();
                        break;
                    case ' ': // 空格键切换自动旋转
                        autoRotate = !autoRotate;
                        autoRotateBtn.textContent = `自动旋转: ${autoRotate ? '开' : '关'}`;
                        break;
                    case 'r': // R键重置视角
                        resetView();
                        break;
                    case 'f': // F键切换全屏
                        toggleResolutionFullscreen();
                        break;
                    case 's': // S键截图
                        takeScreenshot();
                        break;
                    case 'Escape': // ESC键退出全屏
                        if (isFullscreenMode) {
                            exitFullscreenMode();
                        }
                        break;
                }
                
                // 限制垂直视角
                spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi));
                updateCameraPosition();
            }
            
            // 事件监听
            canvas.addEventListener('mousedown', handleStart);
            document.addEventListener('mousemove', handleMove);
            document.addEventListener('mouseup', handleEnd);
            document.addEventListener('mouseleave', handleEnd);
            canvas.addEventListener('wheel', handleWheel, { passive: false });
            
            canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
            document.addEventListener('touchmove', handleTouchMove, { passive: false });
            document.addEventListener('touchend', handleEnd);
            
            document.addEventListener('keydown', handleKeyDown);
            
            // 窗口大小改变
            window.addEventListener('resize', function() {
                if (!renderer) return;
                
                if (!isFullscreenMode) {
                    // 正常模式下自动调整
                    setTimeout(() => {
                        camera.aspect = container.clientWidth / container.clientHeight;
                        camera.updateProjectionMatrix();
                        renderer.setSize(container.clientWidth, container.clientHeight);
                    }, 100);
                } else if (selectedResolution === 'auto') {
                    // 自适应全屏模式下自动调整
                    setTimeout(() => {
                        camera.aspect = canvas.clientWidth / canvas.clientHeight;
                        camera.updateProjectionMatrix();
                        renderer.setSize(canvas.clientWidth, canvas.clientHeight);
                    }, 100);
                }
            });
            
            // 上传功能
            uploadArea.addEventListener('click', function() {
                fileInput.click();
            });
            
            fileInput.addEventListener('change', function(e) {
                if (e.target.files.length > 0) {
                    handleFile(e.target.files[0]);
                }
            });
            
            uploadArea.addEventListener('dragover', function(e) {
                e.preventDefault();
                uploadArea.classList.add('dragover');
            });
            
            uploadArea.addEventListener('dragleave', function(e) {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
            });
            
            uploadArea.addEventListener('drop', function(e) {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
                
                if (e.dataTransfer.files.length > 0) {
                    handleFile(e.dataTransfer.files[0]);
                }
            });
            
            function handleFile(file) {
                // 检查文件类型
                const allowedTypes = ['image/jpeg', 'image/png', 'image/webp'];
                if (!allowedTypes.includes(file.type)) {
                    showError('不支持的文件格式，请上传JPG、PNG或WebP格式的图片');
                    return;
                }
                
                // 检查文件大小（限制为50MB）
                if (file.size > 50 * 1024 * 1024) {
                    showError('文件太大，请上传小于50MB的图片');
                    return;
                }
                
                info.textContent = `正在读取文件: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)}MB)`;
                
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    loadPanorama(e.target.result);
                };
                
                reader.onerror = function() {
                    showError('文件读取失败');
                };
                
                reader.readAsDataURL(file);
            }
            
            // 控制按钮事件
            autoRotateBtn.addEventListener('click', function() {
                autoRotate = !autoRotate;
                autoRotateBtn.textContent = `自动旋转: ${autoRotate ? '开' : '关'}`;
            });
            
            resetBtn.addEventListener('click', resetView);
            
            fullscreenBtn.addEventListener('click', toggleResolutionFullscreen);
            
            exitFullscreenBtn.addEventListener('click', exitFullscreenMode);
            
            screenshotBtn.addEventListener('click', takeScreenshot);
            
            // 分辨率选择只记录值
            resolutionSelect.addEventListener('change', function() {
                selectedResolution = this.value;
                info.textContent = `全景图尺寸: ${sphere.material.map.image.width}x${sphere.material.map.image.height}px | 当前分辨率: ${selectedResolution === 'auto' ? '自适应' : selectedResolution.replace('x', '×')}`;
            });
            
            speedSlider.addEventListener('input', function() {
                rotateSpeed = parseFloat(this.value) * 0.01;
            });
            
            // 辅助函数
            function showLoading() {
                loadingOverlay.classList.add('active');
            }
            
            function hideLoading() {
                loadingOverlay.classList.remove('active');
            }
            
            function showError(message) {
                info.textContent = message;
                info.classList.add('error-message');
                info.classList.remove('success-message');
                
                setTimeout(function() {
                    info.textContent = '等待上传全景图...';
                    info.classList.remove('error-message');
                }, 5000);
            }
            
            function showSuccess(message) {
                info.textContent = message;
                info.classList.add('success-message');
                info.classList.remove('error-message');
                
                setTimeout(function() {
                    if (panoramaLoaded) {
                        info.textContent = `全景图尺寸: ${sphere.material.map.image.width}x${sphere.material.map.image.height}px | 当前分辨率: ${selectedResolution === 'auto' ? '自适应' : selectedResolution.replace('x', '×')}`;
                    }
                    info.classList.remove('success-message');
                }, 2000);
            }
            
            // 初始化场景
            initScene();
            
            // 初始化按钮状态
            fullscreenBtn.disabled = true;
            screenshotBtn.disabled = true;
        });
    </script>
</body>
</html>
